<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<style>
:root{--bg:#05070b;--panel:#0d141e;--panel2:#121d29;--text:#f4f7fb;--muted:#8e9aaa;--line:#ffffff16;--green:#7cf0c1;--blue:#79a9ff;--max:1240px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 Inter,system-ui,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(#000,transparent 75%)}
body:after{content:"";position:fixed;width:650px;height:650px;right:-250px;top:-300px;z-index:-1;background:radial-gradient(circle,#7cf0c11a,transparent 68%)}
a{color:inherit;text-decoration:none}.wrap{width:min(calc(100% - 44px),var(--max));margin:auto}
nav{position:fixed;top:0;left:0;right:0;z-index:10;background:#05070bd9;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:800;letter-spacing:-.04em}.logo i{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:9px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--blue));color:#03100b;font-style:normal}
.links{display:flex;gap:28px;color:#9ba7b7;font-size:.86rem}.links a:hover{color:#fff}
.navbtn,.btn{border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:700;font-size:.84rem}.navbtn{border-radius:999px}
.hero{min-height:100vh;padding:150px 0 90px;display:grid;grid-template-columns:1.3fr .7fr;gap:70px;align-items:center}
.kicker,.eyebrow{font:500 .7rem "DM Mono",monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--green)}
.kicker:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green);margin-right:9px}
h1{font-size:clamp(4rem,9vw,8.5rem);line-height:.84;letter-spacing:-.09em;margin:22px 0 28px}.grad{background:linear-gradient(110deg,#fff,#bdc8d7 55%,var(--green));color:transparent;background-clip:text}
.lead{max-width:760px;color:#aeb8c7;font-size:clamp(1.05rem,1.8vw,1.3rem)}.lead b{color:#edf3f8}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}.btn{display:inline-block;transition:.25s}.btn:hover{transform:translateY(-3px);border-color:#7cf0c14d}.primary{background:var(--green);border-color:var(--green);color:#03100b;box-shadow:0 12px 45px #7cf0c11c}
.meta{display:flex;gap:30px;flex-wrap:wrap;margin-top:35px;color:#6e7b8c;font:500 .65rem "DM Mono"}.meta b{display:block;color:#dce4ed;font:600 .78rem Inter;margin-top:4px}
.visual{min-height:500px;display:grid;place-items:center;position:relative}.orbit{width:420px;height:420px;border:1px solid #7cf0c11f;border-radius:50%;position:relative;animation:spin 28s linear infinite}.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid #79a9ff20;border-radius:50%}.orbit:before{inset:55px}.orbit:after{inset:115px;border-color:#9c8cff20}
@keyframes spin{to{transform:rotate(360deg)}}.core{position:absolute;width:185px;height:185px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#7cf0c133,#080d13 67%);border:1px solid #7cf0c159;box-shadow:0 0 90px #7cf0c11c}.core b{display:block;text-align:center;font-size:2.5rem;letter-spacing:-.07em}.core span{display:block;text-align:center;color:#8795a6;font:500 .6rem "DM Mono";text-transform:uppercase}
.node{position:absolute;width:52px;height:52px;border-radius:16px;background:#0b1119;border:1px solid var(--line);display:grid;place-items:center;color:#b8c3d0;font:500 .62rem "DM Mono";text-align:center}.node:nth-child(1){top:-26px;left:calc(50% - 26px)}.node:nth-child(2){right:-26px;top:calc(50% - 26px)}.node:nth-child(3){bottom:-26px;left:calc(50% - 26px)}.node:nth-child(4){left:-26px;top:calc(50% - 26px)}
.float{position:absolute;background:#0a1017d9;backdrop-filter:blur(15px);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.72rem;color:#a9b4c2}.float b{display:block;color:white;margin-bottom:2px}.f1{top:40px;right:0}.f2{bottom:45px;left:0}
section{padding:120px 0;border-top:1px solid var(--line)}.head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:46px}.head h2{font-size:clamp(2.7rem,5vw,5rem);line-height:.94;letter-spacing:-.07em;margin:12px 0 0}.copy{color:var(--muted);max-width:550px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:28px;min-height:220px;background:linear-gradient(145deg,#121d29c9,#0a1017c9);border:1px solid var(--line);border-radius:24px;transition:.3s}.card:hover{transform:translateY(-6px);border-color:#7cf0c140}.num{font:500 .67rem "DM Mono";color:var(--green)}.card h3{margin:30px 0 9px;font-size:1.2rem;letter-spacing:-.03em}.card p{color:var(--muted);font-size:.88rem}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:17px}.chip{font-size:.65rem;color:#9ca9b8;border:1px solid var(--line);padding:5px 8px;border-radius:999px}
.story{display:grid;grid-template-columns:.8fr 1.2fr;gap:70px}.sticky{align-self:start;position:sticky;top:120px}.statement{font-size:clamp(2rem,4vw,3.7rem);line-height:1.04;letter-spacing:-.06em;margin-top:18px}.muted{color:#566273}
.timeline{border-left:1px solid var(--line);padding-left:28px}.job{position:relative;padding:0 0 48px}.job:before{content:"";position:absolute;left:-33px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 18px #7cf0c180}.date{color:var(--green);font:500 .67rem "DM Mono"}.job h3{margin:8px 0 2px;font-size:1.35rem}.job h4{margin:0 0 12px;color:#748194;font-size:.85rem}.job p,.job li{color:var(--muted);font-size:.88rem}.job ul{padding-left:18px}
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.project{min-height:250px;padding:30px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(145deg,#111c28,#080d13);position:relative;overflow:hidden}.project:after{content:"";position:absolute;width:260px;height:260px;right:-130px;bottom:-130px;border-radius:50%;background:radial-gradient(circle,#79a9ff18,transparent 68%)}.project h3{margin:48px 0 10px;font-size:1.6rem;letter-spacing:-.05em}.project p{color:var(--muted);font-size:.9rem}.tagline{position:absolute;bottom:27px;color:#657386;font:500 .62rem "DM Mono";letter-spacing:.1em;text-transform:uppercase}
.contact{padding:48px;border:1px solid #7cf0c126;border-radius:30px;background:radial-gradient(circle at 80% 20%,#7cf0c10d,transparent 35%),linear-gradient(145deg,#111b27,#080d13);display:grid;grid-template-columns:1.2fr .8fr;gap:30px}.contact h2{font-size:clamp(2.7rem,5vw,5rem);line-height:.94;letter-spacing:-.07em;margin:12px 0}.contact p{color:var(--muted);max-width:620px}.contact-side{display:flex;flex-direction:column;justify-content:center;gap:11px}.contact-link{padding:15px;border:1px solid var(--line);border-radius:13px;background:#ffffff04;font-size:.8rem}
footer{padding:35px 0;border-top:1px solid var(--line);color:#687587;font:500 .65rem "DM Mono";display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.08em}
.reveal{opacity:0;transform:translateY(24px);transition:.8s}.reveal.show{opacity:1;transform:none}
@media(max-width:950px){.hero{grid-template-columns:1fr}.visual{min-height:430px}.grid{grid-template-columns:1fr 1fr}.story{grid-template-columns:1fr}.sticky{position:static}.contact{grid-template-columns:1fr}}
@media(max-width:650px){.wrap{width:min(calc(100% - 28px),var(--max))}.links,.navbtn{display:none}.hero{padding-top:125px}.orbit{width:320px;height:320px}.core{width:145px;height:145px}.grid,.projects{grid-template-columns:1fr}section{padding:85px 0}.head{display:block}.copy{margin-top:20px}.contact{padding:28px}footer{display:block;line-height:2}}
</style>
</head>
